<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#667eea,#764ba2);
font-family:Arial;
}
.box{
background:white;
padding:30px;
border-radius:10px;
width:300px;
}
input{
width:100%;
padding:10px;
margin:10px 0;
}
button{
width:100%;
padding:10px;
background:#667eea;
color:white;
border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<form action="log.jsp" method="post">
<input type="text" name="name" placeholder="Enter Name" required>
<input type="password" name="password" placeholder="Enter Password" required>
<button>Login</button>
</form>

</div>

</body>
</html>
