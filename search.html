<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search the Team</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    width: 350px;
}

h2{
    text-align: center;
    margin-bottom: 20px;
}

table{
    width: 100%;
}

td{
    padding: 10px;
}

input[type="text"]{
    width: 100%;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

input[type="submit"]{
    width: 100%;
    padding: 10px;
    background: #4facfe;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

input[type="submit"]:hover{
    background: #007bff;
}

</style>

</head>

<body>

<div class="container">

<h2>Search Team</h2>

<form action="search.jsp" method="post">
<table>
<tr>
<td>Team Name:</td>
<td><input type="text" name="teamname" required /></td>
</tr>

<tr>
<td colspan="2">
<input type="submit" value="Search">
</td>
</tr>
</table>
</form>

</div>

</body>
</html>
