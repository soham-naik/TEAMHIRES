<!DOCTYPE html>
<html>
<head>
<title>Apply Project</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    background:#4facfe;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#007bff;
}

</style>

</head>

<body>

<div class="container">

<h2>Apply Project</h2>

<form action="apply.jsp" method="post">

<label>Team Name</label>
<input type="text" name="teamname" required>

<label>Project Name</label>
<input type="text" name="projectname" required>

<label>Status</label>
<select name="status">
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>

<button type="submit">Update Status</button>

</form>

</div>

</body>
</html>
